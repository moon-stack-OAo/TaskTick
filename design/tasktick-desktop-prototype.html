<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Task — 桌面定时任务</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: oklch(98.2% 0.004 250);
      --surface: oklch(100% 0 0);
      --fg: oklch(22% 0.02 240);
      --muted: oklch(48% 0.016 240);
      --border: oklch(91% 0.007 240);
      --border-soft: oklch(94% 0.006 240);
      --accent: oklch(55% 0.17 250);
      --accent-fg: oklch(99% 0 0);
      --success: oklch(48% 0.14 145);
      --success-bg: oklch(96% 0.035 145);
      --danger: oklch(52% 0.18 25);
      --danger-bg: oklch(96.5% 0.03 25);
      --warn: oklch(58% 0.13 75);
      --warn-bg: oklch(97.5% 0.035 85);
      --sidebar: oklch(97.5% 0.005 250);
      --titlebar: oklch(97% 0.005 250);
      --shadow: 0 1px 2px oklch(22% 0.02 240 / 0.04), 0 6px 18px oklch(22% 0.02 240 / 0.05);
      --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --radius: 10px;
      --focus: 0 0 0 2px var(--surface), 0 0 0 4px oklch(55% 0.17 250 / 0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-body);
      color: var(--fg);
      background:
        radial-gradient(1200px 600px at 10% -10%, oklch(94% 0.03 250), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, oklch(95% 0.02 230), transparent 55%),
        oklch(92% 0.01 250);
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: none; box-shadow: var(--focus); }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 20px 40px;
      gap: 18px;
    }

    .app-window {
      width: min(1180px, 100%);
      height: min(760px, calc(100vh - 80px));
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow), 0 20px 48px oklch(22% 0.02 240 / 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .titlebar {
      height: 40px;
      background: var(--titlebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 14px;
      user-select: none;
      flex-shrink: 0;
    }
    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .app-mark {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: linear-gradient(145deg, oklch(62% 0.17 250), var(--accent));
      display: grid;
      place-items: center;
      color: white;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .titlebar-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .titlebar-sub {
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }
    .window-controls { display: flex; gap: 2px; }
    .win-btn {
      width: 36px;
      height: 28px;
      border: 0;
      background: transparent;
      border-radius: 6px;
      color: var(--muted);
      display: grid;
      place-items: center;
    }
    .win-btn:hover { background: oklch(90% 0.01 240); color: var(--fg); }
    .win-btn.close:hover { background: oklch(55% 0.2 25); color: white; }

    .shell {
      flex: 1;
      display: grid;
      grid-template-columns: 200px 1fr;
      min-height: 0;
    }

    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      gap: 4px;
      min-height: 0;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--fg);
      text-align: left;
    }
    .nav-item:hover { background: oklch(94% 0.01 250); }
    .nav-item.active {
      background: oklch(93% 0.035 250);
      color: oklch(40% 0.14 250);
    }
    .nav-item .icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      opacity: 0.85;
    }
    .nav-item .badge {
      margin-left: auto;
      font-size: 11px;
      font-family: var(--font-mono);
      background: oklch(92% 0.01 240);
      color: var(--muted);
      border-radius: 999px;
      padding: 1px 7px;
      min-width: 22px;
      text-align: center;
    }
    .nav-item.active .badge {
      background: oklch(88% 0.05 250);
      color: oklch(40% 0.14 250);
    }
    .sidebar-foot {
      margin-top: auto;
      padding: 10px 8px 4px;
      border-top: 1px solid var(--border);
    }
    .status-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      padding: 8px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px oklch(52% 0.14 145 / 0.18);
      flex-shrink: 0;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }
    .topbar {
      height: 56px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .topbar-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .topbar-title {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .topbar-desc {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 420px;
    }
    .topbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .page-header {
      padding: 18px 22px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .page-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .page-desc {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    .btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 550;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: oklch(48% 0.17 250);
    }
    .btn-primary:hover { background: oklch(48% 0.17 250); color: var(--accent-fg); }
    .btn-secondary {
      background: var(--surface);
      border-color: var(--border);
      color: var(--fg);
    }
    .btn-secondary:hover { background: oklch(96% 0.008 250); }
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--fg);
    }
    .btn-ghost:hover { background: oklch(94% 0.01 250); }
    .btn-danger-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--danger);
    }
    .btn-danger-ghost:hover { background: var(--danger-bg); }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
    .btn-icon {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: inline-grid;
      place-items: center;
    }
    .btn-icon:hover { background: oklch(94% 0.01 250); color: var(--fg); }

    .content {
      flex: 1;
      overflow: auto;
      padding: 14px 18px 18px;
      min-height: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .search {
      flex: 1;
      min-width: 180px;
      max-width: 320px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 0 12px 0 34px;
      position: relative;
      font-size: 13px;
    }
    .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 320px; }
    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .search:hover { border-color: oklch(84% 0.015 240); }
    .search:focus { border-color: oklch(70% 0.1 250); box-shadow: var(--focus); outline: none; }

    .filter-group {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .filter-chip {
      height: 28px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 500;
    }
    .filter-chip:hover { color: var(--fg); background: oklch(96% 0.008 250); }
    .filter-chip.active {
      background: oklch(93% 0.035 250);
      color: oklch(40% 0.14 250);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 2px oklch(22% 0.02 240 / 0.03);
    }

    .task-table { width: 100%; border-collapse: collapse; }
    .task-table th {
      text-align: left;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: oklch(99.2% 0.002 250);
      white-space: nowrap;
    }
    .task-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
      font-size: 13.5px;
    }
    .task-table tr:last-child td { border-bottom: 0; }
    .task-table tbody tr:hover td { background: oklch(98.6% 0.006 250); }

    .task-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .task-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.4;
    }
    .mono { font-family: var(--font-mono); font-size: 12px; }
    .muted { color: var(--muted); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .pill-ok {
      background: var(--success-bg);
      color: var(--success);
      border-color: oklch(88% 0.05 145);
    }
    .pill-fail {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: oklch(90% 0.04 25);
    }
    .pill-off {
      background: oklch(96% 0.008 240);
      color: oklch(45% 0.015 240);
      border-color: oklch(90% 0.01 240);
    }
    .pill-on {
      background: oklch(94% 0.03 250);
      color: oklch(40% 0.14 250);
      border-color: oklch(88% 0.05 250);
    }
    .pill-info { background: oklch(95% 0.025 250); color: oklch(42% 0.14 250); border-color: oklch(90% 0.04 250); }
    .pill-warn { background: var(--warn-bg); color: oklch(48% 0.12 75); border-color: oklch(90% 0.05 85); }
    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.9;
    }

    .switch {
      width: 36px;
      height: 20px;
      border-radius: 999px;
      border: 0;
      background: oklch(84% 0.015 240);
      position: relative;
      transition: background 0.15s ease;
      padding: 0;
      flex-shrink: 0;
    }
    .switch.on { background: var(--accent); }
    .switch::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      top: 2px;
      left: 2px;
      transition: transform 0.15s ease;
      box-shadow: 0 1px 2px oklch(22% 0.02 240 / 0.25);
    }
    .switch.on::after { transform: translateX(16px); }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    .row-actions .btn-sm { min-width: 64px; }

    .task-list {
      display: flex;
      flex-direction: column;
    }
    .task-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--surface);
      transition: background 0.12s ease;
    }
    .task-row:last-child { border-bottom: 0; }
    .task-row:hover { background: oklch(98.6% 0.006 250); }
    .task-row-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .task-row-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .task-row-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .task-row-title .name {
      font-weight: 600;
      font-size: 14px;
      color: var(--fg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .task-row-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }
    .task-row-summary .sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: oklch(78% 0.01 240);
      flex-shrink: 0;
    }
    .task-row-summary .sum-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 420px;
    }
    .task-row-aside {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      justify-self: end;
    }
    .task-row-last {
      min-width: 118px;
      text-align: right;
    }
    .task-row-last .task-meta {
      margin-top: 4px;
    }

    .menu {
      position: absolute;
      z-index: 40;
      min-width: 168px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 4px;
    }
    .menu button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 13px;
      color: var(--fg);
    }
    .menu button:hover { background: oklch(96% 0.008 250); }
    .menu button.danger { color: var(--danger); }
    .menu button.danger:hover { background: var(--danger-bg); }
    .menu-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 6px;
    }

    .empty {
      padding: 52px 24px;
      text-align: center;
      color: var(--muted);
    }
    .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      border-radius: 12px;
      background: oklch(96% 0.02 250);
      color: var(--accent);
      display: grid;
      place-items: center;
    }
    .empty h3 {
      margin: 0 0 6px;
      color: var(--fg);
      font-size: 15px;
    }
    .empty p { margin: 0; font-size: 13px; line-height: 1.5; max-width: 360px; margin-inline: auto; }

    .toast {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      background: var(--fg);
      color: oklch(98% 0.005 250);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 360px;
      animation: toast-in 0.18s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form / editor */
    .form-grid {
      display: grid;
      gap: 16px;
      max-width: 760px;
    }
    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .field .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.4;
    }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 0 12px;
      height: 36px;
      font-size: 13.5px;
    }
    .textarea {
      height: auto;
      min-height: 72px;
      padding: 10px 12px;
      resize: vertical;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.45;
    }
    .input:hover, .select:hover, .textarea:hover { border-color: oklch(84% 0.015 240); }
    .input:focus, .select:focus, .textarea:focus {
      border-color: oklch(70% 0.1 250);
      box-shadow: var(--focus);
      outline: none;
    }
    .seg {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
      flex-wrap: wrap;
    }
    .seg button {
      height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
    }
    .seg button:hover { color: var(--fg); background: oklch(96% 0.008 250); }
    .seg button.active {
      background: oklch(93% 0.035 250);
      color: oklch(40% 0.14 250);
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .action-block {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .action-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .action-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    /* Logs */
    .log-row { cursor: pointer; }
    .log-detail {
      background: oklch(98.5% 0.004 250);
      border-top: 1px dashed var(--border);
      padding: 14px 16px 16px 42px;
      color: oklch(35% 0.02 240);
      line-height: 1.55;
    }
    .log-detail-raw {
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-soft);
      color: oklch(40% 0.02 240);
    }
    .timeline {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    function summarizeTrigger(trigger) {
      if (!trigger) return "—";
      if (trigger.type === "once") return `一次性 · ${trigger.datetime || "未设置"}`;
      if (trigger.type === "daily") return `每天 ${trigger.time || "--:--"}`;
      if (trigger.type === "interval") return `每 ${trigger.every || "?"} ${trigger.unit || "分钟"}`;
      if (trigger.type === "cron") return trigger.note || trigger.expr || "Cron";
      return TRIGGER_LABELS[trigger.type] || "—";
    }

    function summarizeActions(actions = []) {
      if (!actions.length) return "无动作";
      return actions.map((a) => {
        if (a.type === "open_url") return `打开网址 · ${a.url}`;
        if (a.type === "open_app") return `打开应用 · ${shortPath(a.path)}`;
        if (a.type === "run_script") return `运行脚本 · ${a.runtime?.toUpperCase() || "SCRIPT"} · ${shortPath(a.path)}`;
        if (a.type === "wecom_ui_dm") return `企业微信私聊 · ${a.contact || "未指定联系人"}`;
        return ACTION_LABELS[a.type] || a.type;
      }).join("；");
    }

    function shortPath(p = "") {
      if (!p) return "未设置";
      const parts = p.replace(/\\/g, "/").split("/");
      return parts.length > 2 ? `…/${parts.slice(-2).join("/")}` : p;
    }

    function uid(prefix) {
      return `${prefix}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function emptyAction() {
      return {
        id: uid("a"),
        type: "open_url",
        url: "",
        path: "",
        runtime: "ps1",
        args: "",
        contact: "",
        message: "",
        launchWecom: true,
        timeoutSec: 30,
        retryCount: 0,
        notifyOnFail: true,
      };
    }

    function stepStatusLabel(status) {
      if (status === "ok") return "成功";
      if (status === "fail") return "失败";
      return "跳过";

    function TaskListView({
      tasks, filter, setFilter,
      onCreate, onEdit, onToggle, onRun, onDuplicate, onDelete, flashId, forceEmpty,
    }) {
      const [menu, setMenu] = useState(null);
      const menuRef = useRef(null);

      useEffect(() => {
        function onDoc(e) {
          if (menuRef.current && !menuRef.current.contains(e.target)) setMenu(null);
        }
        document.addEventListener("mousedown", onDoc);
        return () => document.removeEventListener("mousedown", onDoc);
      }, []);

      const filtered = useMemo(() => {
        if (forceEmpty) return [];
        return tasks.filter((t) => {
          if (filter === "enabled" && !t.enabled) return false;
          if (filter === "disabled" && t.enabled) return false;
          return true;
        });
      }, [tasks, filter, forceEmpty]);

      const enabledCount = tasks.filter((t) => t.enabled).length;
      const disabledCount = tasks.length - enabledCount;

      return (
        <div className="content">
          <div className="notice" data-od-id="ui-automation-notice" style={{ marginBottom: 12 }}>
            <svg className="notice-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <circle cx="9" cy="9" r="7.2" stroke="currentColor" strokeWidth="1.4"/>
              <path d="M9 5.2v5.2M9 12.6h.01" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
            <div>
              <strong>UI 自动化插件</strong>
              ：企业微信 · 发私聊依赖窗口控件定位。企微改版、窗口未前台或联系人名称不一致可能导致失败；首版仅支持私聊，不含群聊。建议保存前先做预检。
            </div>

          <div className="subbar" data-od-id="tasks-toolbar">
            <div className="filter-group" data-od-id="task-filter">
              {[
                { id: "all", label: `全部 ${tasks.length}` },
                { id: "enabled", label: `已启用 ${enabledCount}` },
                { id: "disabled", label: `已禁用 ${disabledCount}` },
              ].map((f) => (
                <button
                  key={f.id}
                  type="button"
                  className={`filter-chip${filter === f.id ? " active" : ""}`}
                  onClick={() => setFilter(f.id)}
                  data-od-id={`task-filter-${f.id}`}
                >
                  {f.label}
                </button>
              ))}
            </div>
            <div className="muted" style={{ fontSize: 12.5 }}>
              {forceEmpty ? "空状态预览中" : `当前展示 ${filtered.length} 条`}
            </div>
          </div>

          <div className="card" data-od-id="task-list-card">
            {filtered.length === 0 ? (
              <div className="empty" data-od-id="tasks-empty">

                <p>

                    : "试试切换「全部 / 已启用 / 已禁用」，或清空搜索关键词。"}

                {(tasks.length === 0 || forceEmpty) && (

            ) : (
              <div className="task-list" data-od-id="task-table">
                {filtered.map((task) => (
                  <div
                    key={task.id}
                    className={`task-row${flashId === task.id ? " run-flash" : ""}`}

                            setMenu({
                              id: task.id,
                              top: rect.bottom - parent.top + 4,
                              left: Math.min(rect.right - parent.left - 168, parent.width - 180),
                            });
                          }}
                        >
                          {Icon.more}
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {menu && (
            <div
              className="menu"
              ref={menuRef}
              style={{ top: menu.top, left: menu.left }}

            >
              <button type="button" onClick={() => { onDuplicate(menu.id); setMenu(null); }}>复制任务</button>

              <button type="button" className="danger" onClick={() => { onDelete(menu.id); setMenu(null); }}>删除</button>
            </div>
          )}
        </div>
      );

    function TaskEditor({ draft, onChange, onSave, onCancel, isNew, showToast }) {
      const update = (patch) => onChange({ ...draft, ...patch });
      const updateTrigger = (patch) => update({ trigger: { ...draft.trigger, ...patch } });
      const updateAction = (idx, patch) => {
        const actions = draft.actions.map((a, i) => (i === idx ? { ...a, ...patch } : a));
        update({ actions });
      };
      const addAction = () => update({ actions: [...draft.actions, emptyAction()] });
      const removeAction = (idx) => {
        if (draft.actions.length <= 1) return;
        update({ actions: draft.actions.filter((_, i) => i !== idx) });
      };

      const canSave = draft.name.trim() && draft.actions.every((a) => {
        if (a.type === "open_url") return !!a.url.trim();
        if (a.type === "wecom_ui_dm") return !!a.contact?.trim() && !!a.message?.trim();
        return !!a.path?.trim();
      });

      const runWecomPrecheck = (action, kind) => {
        const contact = (action.contact || "").trim();
        if (kind === "locate") {
          if (!contact) {
            showToast("请先填写联系人，再测试定位窗口");
            return;
          }
          showToast(`已定位企业微信窗口，并预搜到「${contact}」`);
          return;
        }
        if (!contact || !(action.message || "").trim()) {
          showToast("请先填写联系人与消息内容，再试发送");
          return;
        }
        showToast(`试发送成功：已向「${contact}」模拟发送私聊`);
      };

      return (
        <div className="overlay" data-od-id="task-editor-overlay" onClick={(e) => e.target === e.currentTarget && onCancel()}>
          <div className="modal" data-od-id="task-editor" role="dialog" aria-modal="true">
            <div className="modal-header">
              <h2 data-od-id="editor-title">{isNew ? "新建任务" : "编辑任务"}</h2>
              <button className="btn-icon" type="button" onClick={onCancel} aria-label="关闭">{Icon.close}</button>
            </div>
            <div className="modal-body">
              <div className="form-grid">
                <div className="field" data-od-id="field-name">
                  <label htmlFor="task-name">任务名称</label>
                  <input
                    id="task-name"
                    className="input"
                    value={draft.name}
                    placeholder="例如：工作日备份脚本"
                    onChange={(e) => update({ name: e.target.value })}
                  />
                </div>

                <div className="field" data-od-id="field-trigger">
                  <label>触发器</label>
                  <div className="seg" style={{ marginBottom: 10 }}>
                    {["once", "daily", "cron", "interval"].map((type) => (
                      <button
                        key={type}
                        type="button"
                        className={draft.trigger.type === type ? "active" : ""}
                        data-od-id={`trigger-type-${type}`}
                        onClick={() => updateTrigger({ type })}
                      >
                        {TRIGGER_LABELS[type]}
                      </button>
                    ))}
                  </div>

                  {draft.trigger.type === "once" && (
                    <input
                      className="input"
                      type="datetime-local"
                      value={draft.trigger.datetime || ""}
                      onChange={(e) => updateTrigger({ datetime: e.target.value })}
                    />
                  )}
                  {draft.trigger.type === "daily" && (
                    <div className="row-2">
                      <input
                        className="input"
                        type="time"
                        value={draft.trigger.time || "09:00"}
                        onChange={(e) => updateTrigger({ time: e.target.value })}
                      />
                      <div className="hint" style={{ alignSelf: "center", margin: 0 }}>每天固定时刻触发</div>
                    </div>
                  )}
                  {draft.trigger.type === "cron" && (
                    <>
                      <input
                        className="input mono"
                        value={draft.trigger.expr || ""}
                        placeholder="30 18 * * 1-5"
                        onChange={(e) => updateTrigger({ expr: e.target.value })}
                      />
                      <div className="hint">标准 5 段 cron。示例：工作日 18:30 → <span className="mono">30 18 * * 1-5</span></div>
                      <input
                        className="input"
                        style={{ marginTop: 8 }}
                        value={draft.trigger.note || ""}
                        placeholder="可读摘要（可选），如：工作日 18:30"
                        onChange={(e) => updateTrigger({ note: e.target.value })}
                      />
                    </>
                  )}
                  {draft.trigger.type === "interval" && (
                    <div className="row-2">
                      <input
                        className="input"
                        type="number"
                        min="1"
                        value={draft.trigger.every || 30}
                        onChange={(e) => updateTrigger({ every: Number(e.target.value) })}
                      />

    function LogsView({ logs, filter, setFilter, query }) {
      const [expanded, setExpanded] = useState({ l6: true });
      const filtered = useMemo(() => {
        return logs.filter((l) => {
          if (filter === "success" && l.status !== "success") return false;
          if (filter === "failed" && l.status !== "failed") return false;
          if (!query.trim()) return true;
          const q = query.trim().toLowerCase();
          return l.taskName.toLowerCase().includes(q) || l.detail.toLowerCase().includes(q) || l.time.includes(q);
        });
      }, [logs, filter, query]);

      const successCount = logs.filter((l) => l.status === "success").length;
      const failedCount = logs.filter((l) => l.status === "failed").length;

      return (
        <div className="content">
          <div className="subbar">
            <div className="filter-group" data-od-id="log-filter">
              {[
                { id: "all", label: `全部 ${logs.length}` },
                { id: "success", label: `成功 ${successCount}` },
                { id: "failed", label: `失败 ${failedCount}` },
              ].map((f) => (
                <button
                  key={f.id}
                  type="button"
                  className={`filter-chip${filter === f.id ? " active" : ""}`}
                  onClick={() => setFilter(f.id)}
                  data-od-id={`log-filter-${f.id}`}
                >
                  {f.label}
                </button>
              ))}
            </div>
            <div className="muted" style={{ fontSize: 12.5 }}>展开条目可查看步骤时间线</div>
          </div>

          <div className="card" data-od-id="log-list-card">
            {filtered.length === 0 ? (
              <div className="empty" data-od-id="logs-empty">
                <div className="empty-icon">{Icon.logs}</div>
                <h3>{logs.length === 0 ? "暂无执行记录" : "没有匹配的日志"}</h3>
                <p>{logs.length === 0 ? "任务执行后会在这里留下成功或失败记录，并展示步骤时间线。" : "试试调整筛选条件或清空搜索。"}</p>
              </div>
            ) : (
              <table className="task-table">
                <thead>
                  <tr>
                    <th style={{ width: 36 }}></th>
                    <th style={{ width: 168 }}>时间</th>
                    <th>任务</th>
                    <th style={{ width: 110 }}>结果</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((log) => {
                    const open = !!expanded[log.id];
                    return (
                      <React.Fragment key={log.id}>
                        <tr
                          className="log-row"
                          data-od-id={`log-row-${log.id}`}
                          onClick={() => setExpanded((s) => ({ ...s, [log.id]: !open }))}
                        >
                          <td style={{ color: "var(--muted)" }}>
                            <span style={{ display: "inline-block", transform: open ? "rotate(180deg)" : "none", transition: "transform .15s" }}>
                              {Icon.chevron}
                            </span>
                          </td>
                          <td className="mono">{log.time}</td>
                          <td>{log.taskName}</td>
                          <td>
                            <span className={`pill ${log.status === "success" ? "pill-ok" : "pill-fail"}`}>
                              <span className="pill-dot" />
                              {log.status === "success" ? "成功" : "失败"}
                            </span>
                          </td>
                        </tr>
                        {open && (
                          <tr data-od-id={`log-detail-${log.id}`}>
                            <td colSpan={4} style={{ padding: 0 }}>
                              <div className="log-detail">
                                {Array.isArray(log.steps) && log.steps.length > 0 ? (
                                  <ul className="timeline" data-od-id={`log-timeline-${log.id}`}>
                                    {log.steps.map((step, i) => (
                                      <li className="timeline-item" key={`${log.id}-step-${i}`}>
                                        <span className={`tl-dot ${step.status}`} />
                                        <div className="tl-body">
                                          <div className="tl-title">
                                            {step.title}
                                            <span className={`pill ${step.status === "ok" ? "pill-ok" : step.status === "fail" ? "pill-fail" : "pill-off"}`}>
                                              {stepStatusLabel(step.status)}
                                            </span>
                                          </div>
                                          <div className="tl-meta">{step.time} · {step.note}</div>
                                        </div>
                                      </li>
                                    ))}
                                  </ul>
                                ) : null}
                                <div className="log-detail-raw">{log.detail}</div>
                              </div>
                            </td>
                          </tr>
                        )}
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState("tasks");
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [logs, setLogs] = useState(INITIAL_LOGS);
      const [taskQuery, setTaskQuery] = useState("");
      const [taskFilter, setTaskFilter] = useState("all");
      const [logQuery, setLogQuery] = useState("");
      const [logFilter, setLogFilter] = useState("all");
      const [editor, setEditor] = useState(null);
      const [toast, setToast] = useState(null);
      const [flashId, setFlashId] = useState(null);
      const [trayOpen, setTrayOpen] = useState(true);
      const [forceEmpty, setForceEmpty] = useState(false);
      const [settings, setSettings] = useState({
        autoStart: true,
        minimizeToTray: true,
        failNotify: true,
        notifyGranted: true,
        schedulerPaused: false,
        missPolicy: "skip",
        timezone: "Asia/Shanghai (UTC+8)",
        flauiEnabled: true,
        flauiPath: "C:/Program Files/TaskTick/agents/FlaUI.Agent.exe",
        flauiDetected: true,
        flauiFallback: true,
        wecomIdleOnly: true,
        wecomIdleSec: 8,
        dataDir: "C:/Users/Jinsp/AppData/Roaming/AutoTask",
        storeFiles: ["tasks.json", "logs.jsonl", "plugins.json", "update-cache/"],
        taskCount: 4,
        logCount: 6,
        pluginCount: 1,
      });

      const showToast = (message) => {
        setToast(message);
        window.clearTimeout(showToast._t);
        showToast._t = window.setTimeout(() => setToast(null), 2200);
      };

      const failCount = logs.filter((l) => l.status === "failed").length;

      const visibleTasks = useMemo(() => {
        const q = taskQuery.trim().toLowerCase();
        if (!q) return tasks;
        return tasks.filter((t) => (
          t.name.toLowerCase().includes(q) ||
          summarizeTrigger(t.trigger).toLowerCase().includes(q) ||
          summarizeActions(t.actions).toLowerCase().includes(q)
        ));
      }, [tasks, taskQuery]);

      const openCreate = () => setEditor({ mode: "create", draft: emptyTask() });
      const openEdit = (task) => setEditor({
        mode: "edit",
        draft: JSON.parse(JSON.stringify({
          ...task,
          actions: (task.actions || []).map((a) => ({
            retryCount: 0,
            notifyOnFail: true,
            launchWecom: true,
            timeoutSec: 30,
            ...a,
          })),
          trigger: {
            datetime: "",
            time: "09:00",
            expr: "0 9 * * *",
            every: 30,
            unit: "分钟",
            note: "",
            weekdays: [1,2,3,4,5],
            ...task.trigger,
          },
        })),
      });

      const saveEditor = () => {
        const draft = editor.draft;
        if (editor.mode === "create") {
          setTasks((list) => [{ ...draft, lastRunAt: null, lastStatus: null }, ...list]);
          showToast(`已创建任务「${draft.name}」`);
        } else {
          setTasks((list) => list.map((t) => (t.id === draft.id ? { ...t, ...draft } : t)));
          showToast(`已保存「${draft.name}」`);
        }
        setEditor(null);
        setForceEmpty(false);
        setPage("tasks");
      };

      const toggleTask = (id) => {
        setTasks((list) => list.map((t) => {
          if (t.id !== id) return t;
          const enabled = !t.enabled;
          showToast(enabled ? `已启用「${t.name}」` : `已禁用「${t.name}」`);
          return { ...t, enabled };
        }));
      };

      const runTask = (id) => {
        const task = tasks.find((t) => t.id === id);
        if (!task) return;
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const time = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const action = task.actions[0] || {};
        let status = "success";
        let detail = "";
        let steps = [];

        if (action.type === "open_app" && (action.path || "").includes("WXWork")) {
          status = "failed";
          detail = `手动执行\n动作[1/${task.actions.length}] open_app\n路径: ${action.path}\n错误: 找不到指定文件。请检查路径或安装位置。\n退出码: 2`;
          steps = [
            { title: "解析应用路径", status: "ok", time: "+0.01s", note: shortPath(action.path) },
            { title: "启动进程", status: "fail", time: "+0.04s", note: "找不到指定文件 · 退出码 2" },
          ];
        } else if (action.type === "wecom_ui_dm") {
          status = "success";
          const cost = (2 + Math.random() * 3).toFixed(1);
          detail = `手动执行\n动作[1/${task.actions.length}] wecom_ui_dm\n插件: 企业微信 UI 自动化（私聊）\n联系人: ${action.contact || "—"}\n先启动企业微信: ${action.launchWecom ? "是" : "否"}\n超时: ${action.timeoutSec ?? 30}s\n重试: ${action.retryCount ?? 0}\n失败通知: ${action.notifyOnFail !== false ? "开" : "关"}\n结果: 已定位私聊窗口并发送消息\n耗时: ${cost}s`;
          steps = buildWecomSteps(action, true);
        } else if (action.type === "open_url") {
          detail = `手动执行\n动作[1/${task.actions.length}] open_url\nURL: ${action.url}\n结果: 已用默认浏览器打开\n耗时: ${40 + Math.floor(Math.random() * 80)}ms`;
          steps = [
            { title: "解析 URL", status: "ok", time: "+0.01s", note: action.url || "—" },
            { title: "调用默认浏览器", status: "ok", time: "+0.08s", note: "已打开" },
          ];
        } else if (action.type === "run_script") {
          detail = `手动执行\n动作[1/${task.actions.length}] run_script (${action.runtime || "ps1"})\n路径: ${action.path}\n结果: 已触发本地执行器\n耗时: ${40 + Math.floor(Math.random() * 80)}ms`;
          steps = [
            { title: "校验脚本路径", status: "ok", time: "+0.01s", note: shortPath(action.path) },
            { title: "启动运行时", status: "ok", time: "+0.10s", note: (action.runtime || "ps1").toUpperCase() },
            { title: "收集输出", status: "ok", time: "+0.40s", note: "执行完成" },
          ];
        } else {
          detail = `手动执行\n动作[1/${task.actions.length}] ${action.type || "unknown"}\n结果: 已触发本地执行器\n耗时: ${40 + Math.floor(Math.random() * 80)}ms`;
          steps = [{ title: "触发本地执行器", status: "ok", time: "+0.05s", note: "已完成" }];
        }

        setLogs((list) => [{
          id: uid("l"),
          taskId: task.id,
          taskName: task.name,
          time,
          status,
          detail,
          steps,
        }, ...list]);
        setTasks((list) => list.map((t) => t.id === id ? { ...t, lastRunAt: time, lastStatus: status } : t));
        setFlashId(id);
        window.setTimeout(() => setFlashId(null), 800);
        showToast(status === "success" ? `已执行「${task.name}」` : `「${task.name}」执行失败`);
        if (status === "failed") setPage("logs");
      };

      const duplicateTask = (id) => {
        const task = tasks.find((t) => t.id === id);
        if (!task) return;
        const copy = {
          ...JSON.parse(JSON.stringify(task)),
          id: uid("t"),
          name: `${task.name}（副本）`,
          enabled: false,
          lastRunAt: null,
          lastStatus: null,
        };
        setTasks((list) => [copy, ...list]);
        showToast(`已复制「${task.name}」`);
      };

      const deleteTask = (id) => {
        const task = tasks.find((t) => t.id === id);
        setTasks((list) => list.filter((t) => t.id !== id));
        showToast(task ? `已删除「${task.name}」` : "已删除任务");
      };

      const refreshPage = () => {
        if (page === "tasks") showToast(`已刷新任务列表（${tasks.length} 条）`);
        else if (page === "logs") showToast(`已刷新执行日志（${logs.length} 条）`);
        else showToast("已刷新设置");
      };

      return (
        <div className="stage">
          <div className="app-window" data-od-id="app-window">
            <TitleBar />
            <div className="shell">
              <Sidebar
                page={page}
                setPage={(id) => { setPage(id); setForceEmpty(false); }}
                taskCount={tasks.length}
                failCount={failCount}
              />
              <main className="main" data-od-id="main-content">
                <TopBar
                  page={page}
                  taskQuery={taskQuery}
                  setTaskQuery={setTaskQuery}
                  logQuery={logQuery}
                  setLogQuery={setLogQuery}
                  onCreate={openCreate}
                  onRefresh={refreshPage}
                  forceEmpty={forceEmpty}
                  setForceEmpty={setForceEmpty}
                  taskCount={tasks.length}
                />
                {page === "tasks" && (
                  <TaskListView
                    tasks={visibleTasks}
                    filter={taskFilter}
                    setFilter={setTaskFilter}
                    onCreate={openCreate}
                    onEdit={openEdit}
                    onToggle={toggleTask}
                    onRun={runTask}
                    onDuplicate={duplicateTask}
                    onDelete={deleteTask}
                    flashId={flashId}
                    forceEmpty={forceEmpty}
                  />
                )}
                {page === "logs" && (
                  <LogsView
                    logs={logs}
                    filter={logFilter}
                    setFilter={setLogFilter}
                    query={logQuery}
                  />
                )}
                {page === "settings" && (
                  <SettingsView settings={settings} setSettings={setSettings} showToast={showToast} />
                )}
              </main>
            </div>

            {editor && (
              <TaskEditor
                draft={editor.draft}
                isNew={editor.mode === "create"}
                onChange={(draft) => setEditor((e) => ({ ...e, draft }))}
                onSave={saveEditor}
                onCancel={() => setEditor(null)}
                showToast={showToast}
              />
            )}

            {toast && (
              <div className="toast" data-od-id="toast" role="status">{toast}</div>
            )}
          </div>

          <div className="desktop-hint" data-od-id="tray-demo">
            <div>
              桌面示意：主窗口为管理界面；右下角托盘菜单可快速打开、重载或退出。
            </div>
            <div className="tray-area">
              {trayOpen && (
                <div className="tray-menu" data-od-id="tray-menu">
                  <div className="tray-caption">Auto Task</div>
                  <button
                    type="button"
                    data-od-id="tray-open"
                    onClick={() => { setTrayOpen(false); setPage("tasks"); showToast("已打开管理界面"); }}
                  >
                    {Icon.tray} 打开管理界面
                  </button>
                  <button
                    type="button"
                    data-od-id="tray-reload"
                    onClick={() => { showToast(`已重新加载任务（${tasks.length} 条）`); setTrayOpen(false); }}
                  >
                    ↻ 重新加载任务
                  </button>
                  <div className="sep" />
                  <button
                    type="button"
                    data-od-id="tray-exit"
                    onClick={() => { showToast("退出需二次确认（原型示意）"); setTrayOpen(false); }}
                  >
                    退出
                  </button>
                </div>
              )}
              <button
                className="tray-btn"
                type="button"
                data-od-id="tray-icon"
                onClick={() => setTrayOpen((v) => !v)}
              >
                <span className="app-mark" style={{ width: 16, height: 16, fontSize: 9 }}>AT</span>
                系统托盘 · Auto Task
              </button>
            </div>
          </div>
        </div>
      );
    }

    Object.assign(window, { App });
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
