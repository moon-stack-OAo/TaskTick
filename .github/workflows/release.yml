# 正式发版：推送 annotated tag `v*`（如 v0.1.0）触发。
# 独立再构建，不复用 build.yml 的 artifact。
# 发版前请确认 package.json / tauri.conf.json / Cargo.toml / CHANGELOG 版本一致。
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & GitHub Release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+.*)$') {
            throw "Tag 须形如 v0.1.0，当前: $tag"
          }
          $ver = $Matches[1]
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version = $ver"

      - name: Verify version alignment
        shell: pwsh
        run: |
          $expect = "${{ steps.ver.outputs.version }}"
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoLine = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargo = $cargoLine.Matches.Groups[1].Value
          Write-Host "tag=$expect package=$pkg tauri=$tauri cargo=$cargo"
          if ($pkg -ne $expect -or $tauri -ne $expect -or $cargo -ne $expect) {
            throw "版本不一致：tag / package.json / tauri.conf.json / Cargo.toml 必须同为 $expect"
          }
          $cl = Get-Content CHANGELOG.md -Raw
          if ($cl -notmatch [regex]::Escape("## [$expect]")) {
            throw "CHANGELOG.md 缺少 ## [$expect] 章节"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install npm deps
        run: npm ci

      - name: Stage wecom-agent (self-contained sidecar)
        shell: pwsh
        run: |
          npm run agent:stage
          $staged = "src-tauri/binaries/wecom-agent-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $staged)) { throw "sidecar 未生成: $staged" }
          New-Item -ItemType Directory -Force -Path "dist-agent" | Out-Null
          Copy-Item $staged "dist-agent/wecom-agent.exe" -Force
          Compress-Archive -Path "dist-agent\wecom-agent.exe" -DestinationPath "wecom-agent-windows-x64.zip" -Force

      - name: Extract changelog body
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $raw = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($ver))\].*?(?=^## |\z)"
          $m = [regex]::Match($raw, $pattern)
          if (-not $m.Success) { throw "无法从 CHANGELOG 截取 $ver" }
          $extra = "`n`n---`n安装包由 CI 自动构建（含 updater 签名产物与 ``latest.json``）。安装目录已随附自包含 ``wecom-agent.exe``（与 TaskTick.exe 同目录）；附件 ``wecom-agent-windows-x64.zip`` 为同一 Agent 的独立副本。`n`n**应用内更新**：Release 保持 draft 时客户端读不到 ``latest.json``；人工确认后请 Publish，更新通道才会生效。`n"
          $body = ($m.Value.Trim() + $extra).Trim() + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "release-notes.md"), $body)

      - name: Require updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 Secret TAURI_SIGNING_PRIVATE_KEY（Updater 签名私钥内容）。本地密钥：~/.tauri/tasktick.key"
          }
          $k = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          if ($k.StartsWith("#") -or $k -match "DO NOT COMMIT|REPLACE_ME|placeholder") {
            throw "TAURI_SIGNING_PRIVATE_KEY 看起来是占位/注释，请写入真实私钥内容"
          }

      - name: Tauri build + draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # package.json 在仓库根目录；勿设为 src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 时序 · TaskTick ${{ github.ref_name }}
          releaseBody: See CHANGELOG and assets. Agent zip uploaded in the next step.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Attach agent zip and set release notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" wecom-agent-windows-x64.zip --clobber
          gh release edit "${{ github.ref_name }}" --draft --notes-file release-notes.md
