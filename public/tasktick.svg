<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="时序 · TaskTick">
  <defs>
    <linearGradient id="plate" x1="18%" y1="8%" x2="86%" y2="94%">
      <stop offset="0%" stop-color="#1B4F9C"/>
      <stop offset="48%" stop-color="#2563C7"/>
      <stop offset="100%" stop-color="#1A3F8A"/>
    </linearGradient>
    <linearGradient id="ring" x1="20%" y1="15%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#F4F9FF"/>
      <stop offset="55%" stop-color="#E8F2FF"/>
      <stop offset="100%" stop-color="#B8E7F5"/>
    </linearGradient>
    <linearGradient id="core" x1="30%" y1="20%" x2="70%" y2="85%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feOffset dy="8" result="o"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 圆角底板及透明安全边距 -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#plate)" filter="url(#soft)"/>
  <rect x="96" y="96" width="832" height="832" rx="184" fill="none" stroke="#93C5FD" stroke-opacity="0.22" stroke-width="6"/>
  <!-- 循环调度与自动执行 -->
  <g transform="translate(512 512)">
    <path d="M 168 -168 A 238 238 0 1 1 -168 168" fill="none" stroke="url(#ring)" stroke-width="72" stroke-linecap="round"/>
    <path d="M 96 -248 L 248 -96 L 72 -72 Z" fill="url(#ring)"/>
    <path d="M -52 -78 L -52 78 L 96 0 Z" fill="url(#core)"/>
  </g>
</svg>
